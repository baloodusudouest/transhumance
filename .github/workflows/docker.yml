# Tests (faux Immich, dossier inventé, écran), puis image ghcr.io/<propriétaire>/transhumance:latest et :<version>,
# et (0.10.0) l'encodeur du PC ghcr.io/<propriétaire>/transhumance:encodeur et :encodeur-<version>.
name: Image Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 0.10.0 : ffmpeg pour les tests des vidéos (sans lui, ils sont sautés et le disent ; l'image est quand même testée)
      - name: ffmpeg
        continue-on-error: true
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg
          ffmpeg -hide_banner -version | head -1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests --ignore=tests/interface
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Interface compilée
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx vite build
      - name: Tests d'écran
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium || python -m playwright install chromium
          python -m pytest -q tests/interface
  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/transhumance:latest
            ghcr.io/${{ github.repository_owner }}/transhumance:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 0.10.0 : l'encodeur des vidéos pour le PC (Docker Desktop)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.encodeur
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/transhumance:encodeur
            ghcr.io/${{ github.repository_owner }}/transhumance:encodeur-${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=encodeur
          cache-to: type=gha,mode=max,scope=encodeur
      - name: Démarrage de l'encodeur
        run: |
          image=ghcr.io/${{ github.repository_owner }}/transhumance:encodeur-${{ steps.v.outputs.version }}
          if timeout 30 docker run --rm "$image" >/dev/null 2>&1; then echo "a démarré sans ses variables"; exit 1; fi
          docker run --rm --entrypoint ffmpeg "$image" -hide_banner -encoders | grep -q libx264
      - name: ffmpeg dans l'image du NAS
        run: |
          image=ghcr.io/${{ github.repository_owner }}/transhumance:${{ steps.v.outputs.version }}
          docker run --rm --entrypoint ffmpeg "$image" -hide_banner -encoders | grep -q h264_vaapi
      - name: Démarrage de l'image
        run: |
          image=ghcr.io/${{ github.repository_owner }}/transhumance:${{ steps.v.outputs.version }}
          if timeout 30 docker run --rm "$image" >/dev/null 2>&1; then echo "a démarré sans ses variables"; exit 1; fi
          docker run -d --name essai -e MAISON_PASSWORD=essai-essai-essai -e TRANSHUMANCE_IMMICH_CLE=x -e TRANSHUMANCE_RACINE_IMMICH=/x -p 8097:8097 "$image"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8097/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8097/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/api/arbre)" = 401
          curl -fs http://127.0.0.1:8097/ | grep -q "Transhumance"
      # R11 (audit du 17/11/2026) : étiquette Git de la version publiée, pour retrouver le code de chaque image
      - name: Étiquette Git de version
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          if [ -n "$version" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            git tag "v$version" "$GITHUB_SHA"
            git push origin "v$version"
          fi
